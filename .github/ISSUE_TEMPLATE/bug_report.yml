name: Bug 反馈
description: 报告 octo-server 的已有行为异常或缺陷。
title: "[Bug] "
labels: ["type/bug", "priority/p2", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先[搜索已有 Issue（含已关闭事项）](https://github.com/90le/steward-feedback/issues?q=is%3Aissue)，相同问题请补充到原记录。
        不确定的信息可以写“未知”或“暂无法确认”。填写方法见[反馈指南](https://github.com/90le/steward-feedback/blob/main/CONTRIBUTING.md)。
        本表单公开可见：请勿提交密钥、Webhook 地址、私聊原文或个人身份信息，截图和日志需先脱敏。
        安全漏洞请按[上游安全政策](https://github.com/Mininglamp-OSS/octo-server/blob/main/SECURITY.md)私密报告。
  - type: input
    id: public-proposer
    attributes:
      label: 提出者公开署名（可选）
      description: 可填允许公开的名称或代号，也可留空。代他人登记时不要把自己写成原始提出者；勿填 Octo UID、群号或联系方式。
    validations:
      required: false
  - type: textarea
    id: scenario-and-actual
    attributes:
      label: 使用场景与实际结果
      description: 你正在完成什么操作？遇到了什么异常？
      placeholder: 描述发生问题时的任务，以及你实际看到的结果。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤或发生条件
      description: 写出你能确认的操作顺序；若偶发或暂不能复现，请说明已知条件，无需猜测。
      placeholder: |
        1. 操作前的条件
        2. 执行的操作
        3. 出现的现象
        或：暂不能稳定复现，已知发生条件为……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 你原本希望看到什么？若不确定产品约定，可写出需要确认的疑问。
    validations:
      required: true
  - type: input
    id: version-and-environment
    attributes:
      label: 版本与环境（可选）
      description: 仅填写能看到的产品版本、浏览器或操作系统；不知道可写“未知”，不要粘贴配置文件。
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: 影响与替代办法（可选）
      description: 哪项任务受阻、出现频率如何、是否能绕过？影响规模未知可说明。
    validations:
      required: false
  - type: textarea
    id: evidence-and-links
    attributes:
      label: 公开来源、补充材料或相关 Issue（可选）
      description: 可贴公开来源或相关 Issue 链接、脱敏截图和必要的短日志；非公开来源只写来源类型，勿贴会话链接、私聊原文或身份标识。
    validations:
      required: false
