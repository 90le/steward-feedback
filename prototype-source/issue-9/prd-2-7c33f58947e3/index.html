<!doctype html>
<html lang="zh-CN">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>群置顶到期自动取消（原型）</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f5f7; color: #1f2328; }
  header { background: #24292f; color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 16px; margin: 0; font-weight: 500; }
  main { max-width: 960px; margin: 20px auto; padding: 0 16px; }
  .panel { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; color: #24292f; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  label { font-size: 13px; color: #57606a; }
  select, input[type=text], input[type=datetime-local] { padding: 6px 8px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 13px; background: #fff; }
  button { padding: 6px 12px; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; cursor: pointer; font-size: 13px; }
  button.primary { background: #1f883d; color: #fff; border-color: #1a7f37; }
  button.primary:hover:not(:disabled) { background: #1a7f37; }
  button.danger { color: #cf222e; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { list-style: none; padding: 0; margin: 0; }
  .msg li { border: 1px solid #d0d7de; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
  .msg li.pinned { background: #fff8c5; border-color: #d4a72c; }
  .msg .head { display: flex; justify-content: space-between; font-size: 12px; color: #57606a; margin-bottom: 4px; }
  .msg .body { font-size: 14px; margin-bottom: 6px; white-space: pre-wrap; }
  .msg .meta { font-size: 12px; color: #57606a; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 11px; margin-left: 6px; }
  .badge.pin { background: #d4a72c; color: #fff; }
  .badge.expire { background: #0969da; color: #fff; }
  .actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #24292f; color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 100; max-width: 80vw; }
  #toast.show { opacity: 1; }
  #toast.err { background: #cf222e; }
  #toast.ok { background: #1f883d; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 8px; padding: 20px; min-width: 320px; max-width: 90vw; }
  .modal h3 { margin: 0 0 12px; font-size: 15px; }
  .modal .foot { margin-top: 16px; display: flex; justify-content: flex-end; gap: 8px; }
  .hint { color: #57606a; font-size: 12px; margin-top: 4px; }
  .empty { color: #8b949e; font-size: 13px; text-align: center; padding: 20px 0; }
  .mode-tag { font-size: 11px; padding: 2px 6px; background: #ddf4ff; color: #0969da; border-radius: 10px; margin-left: 8px; }
</style>
</head>
<body>
<header>
  <h1>群置顶到期自动取消 · 原型 <span class="mode-tag" id="mode-tag" data-testid="mode-tag">加载中</span></h1>
  <div>
    <label for="whoami">当前身份：</label>
    <select id="whoami" data-testid="whoami">
      <option value="admin">管理员 Alice（有置顶权限）</option>
      <option value="admin2">管理员 Bob（有置顶权限）</option>
      <option value="member">普通成员 Carol（无置顶权限）</option>
    </select>
  </div>
</header>

<main>
  <section class="panel">
    <h2>发送新消息</h2>
    <div class="row">
      <input type="text" id="new-text" placeholder="输入群消息内容" style="flex:1; min-width:200px;" data-testid="new-text" />
      <label><input type="checkbox" id="new-pin" data-testid="new-pin" /> 同时置顶</label>
      <label>到期时间：<input type="datetime-local" id="new-expire" data-testid="new-expire" /></label>
      <button class="primary" id="send-btn" data-testid="send-btn">发送</button>
    </div>
    <div class="hint">不填到期时间：长期置顶。到期时间必须晚于当前时间。仅有置顶权限的身份才能同时置顶。</div>
  </section>

  <section class="panel">
    <h2>群消息（<span id="msg-count" data-testid="msg-count">0</span>）</h2>
    <ul class="msg" id="msg-list" data-testid="msg-list"></ul>
    <div class="empty" id="msg-empty" data-testid="msg-empty" style="display:none;">暂无消息</div>
  </section>
</main>

<div class="modal-mask" id="expire-modal" data-testid="expire-modal">
  <div class="modal">
    <h3 id="expire-title">设置到期时间</h3>
    <div>
      <label>到期时间：<input type="datetime-local" id="expire-input" data-testid="expire-input" /></label>
      <div class="hint">必须晚于当前时间；留空并点击"取消到期"可恢复长期置顶。</div>
    </div>
    <div class="foot">
      <button id="expire-clear" data-testid="expire-clear">取消到期（保留置顶）</button>
      <button id="expire-cancel" data-testid="expire-cancel">关闭</button>
      <button class="primary" id="expire-save" data-testid="expire-save">保存</button>
    </div>
  </div>
</div>

<div id="toast" data-testid="toast"></div>

<script>
(function(){
  'use strict';
  var HAS_API = document.documentElement.hasAttribute('data-api');
  var modeTag = document.getElementById('mode-tag');
  modeTag.textContent = HAS_API ? '联调模式' : '本地模拟';

  // 模拟身份表（前端展示用；后端有自己独立的判断）
  var USERS = {
    admin:  { id: 'admin',  name: 'Alice',  canPin: true  },
    admin2: { id: 'admin2', name: 'Bob',    canPin: true  },
    member: { id: 'member', name: 'Carol',  canPin: false }
  };

  // 本地模拟数据
  var localSeq = 100;
  var localMsgs = [
    { id: 1, author: 'Alice',  text: '欢迎大家加入本群，欢迎多多交流～',      pinned: false, expireAt: null, createdAt: Date.now() - 3600000*24 },
    { id: 2, author: 'Alice',  text: '【长期公告】本群禁止广告，违者移出。',    pinned: true,  expireAt: null, createdAt: Date.now() - 3600000*10 },
    { id: 3, author: 'Bob',    text: '【本周分享】周五 20:00 线上分享，主题：Node 24 新特性。',
      pinned: true,  expireAt: Date.now() + 60000,  createdAt: Date.now() - 1800000 }
  ];

  function currentUser() {
    return USERS[document.getElementById('whoami').value];
  }

  function toast(text, kind) {
    var el = document.getElementById('toast');
    el.textContent = text;
    el.className = 'show ' + (kind || '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.className = ''; }, 2200);
  }

  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var pad = function(n){ return n < 10 ? '0'+n : ''+n; };
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
  }

  function toDatetimeLocal(ts) {
    if (!ts) return '';
    var d = new Date(ts - d0tzOffset(ts));
    return d.toISOString().slice(0,16);
  }
  function d0tzOffset(ts){ return new Date(ts).getTimezoneOffset()*60000; }
  function fromDatetimeLocal(s) {
    if (!s) return null;
    var t = new Date(s).getTime();
    return isNaN(t) ? null : t;
  }

  // ---------- 数据层：本地 or API ----------
  function apiList() {
    if (HAS_API) {
      return fetch('/api/messages', { headers: { 'X-User-Id': currentUser().id } })
        .then(function(r){ return r.json(); })
        .then(function(d){ return d.messages; });
    }
    // 本地：先扫一次到期
    sweepLocal();
    return Promise.resolve(localMsgs.map(function(m){ return Object.assign({}, m); }));
  }

  function apiSend(text, pin, expireAt) {
    if (HAS_API) {
      return fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-User-Id': currentUser().id },
        body: JSON.stringify({ text: text, pin: pin, expireAt: expireAt })
      }).then(readApi);
    }
    return new Promise(function(resolve, reject){
      var u = currentUser();
      if (!text || !text.trim()) return reject({ code: 'invalid_text', message: '消息内容不能为空' });
      if (pin && !u.canPin) return reject({ code: 'forbidden', message: '当前身份没有置顶权限' });
      if (pin && expireAt != null && expireAt <= Date.now()) return reject({ code: 'invalid_expire', message: '到期时间必须晚于当前时间' });
      var m = { id: ++localSeq, author: u.name, text: text.trim(), pinned: !!pin, expireAt: pin ? (expireAt || null) : null, createdAt: Date.now() };
      localMsgs.push(m);
      resolve({ message: m });
    });
  }

  function apiPin(id, pin) {
    if (HAS_API) {
      return fetch('/api/messages/'+id+'/pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-User-Id': currentUser().id },
        body: JSON.stringify({ pin: pin })
      }).then(readApi);
    }
    return new Promise(function(resolve, reject){
      var u = currentUser();
      if (!u.canPin) return reject({ code: 'forbidden', message: '没有置顶权限' });
      var m = findLocal(id);
      if (!m) return reject({ code: 'not_found', message: '消息不存在' });
      m.pinned = !!pin;
      if (!m.pinned) m.expireAt = null;
      resolve({ message: Object.assign({}, m) });
    });
  }

  function apiExpire(id, expireAt) {
    if (HAS_API) {
      return fetch('/api/messages/'+id+'/expire', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-User-Id': currentUser().id },
        body: JSON.stringify({ expireAt: expireAt })
      }).then(readApi);
    }
    return new Promise(function(resolve, reject){
      var u = currentUser();
      if (!u.canPin) return reject({ code: 'forbidden', message: '没有置顶权限' });
      var m = findLocal(id);
      if (!m) return reject({ code: 'not_found', message: '消息不存在' });
      if (!m.pinned) return reject({ code: 'not_pinned', message: '该消息未处于置顶状态' });
      if (expireAt != null && expireAt <= Date.now()) return reject({ code: 'invalid_expire', message: '到期时间必须晚于当前时间' });
      // 保存失败保护：只有全部校验通过后再写入
      m.expireAt = expireAt;
      resolve({ message: Object.assign({}, m) });
    });
  }

  function readApi(r) {
    return r.json().then(function(d){
      if (!r.ok) throw d.error || { code: 'error', message: '操作失败' };
      return d;
    });
  }

  function findLocal(id){ for (var i=0;i<localMsgs.length;i++) if (localMsgs[i].id===id) return localMsgs[i]; return null; }
  function sweepLocal(){
    var now = Date.now();
    for (var i=0;i<localMsgs.length;i++) {
      var m = localMsgs[i];
      if (m.pinned && m.expireAt != null && m.expireAt <= now) {
        m.pinned = false;
        m.expireAt = null;
      }
    }
  }

  // ---------- 渲染 ----------
  function render() {
    apiList().then(function(list){
      var ul = document.getElementById('msg-list');
      ul.innerHTML = '';
      document.getElementById('msg-count').textContent = list.length;
      document.getElementById('msg-empty').style.display = list.length ? 'none' : '';
      // 置顶排在前
      list.sort(function(a,b){
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return a.createdAt - b.createdAt;
      });
      var u = currentUser();
      list.forEach(function(m){
        var li = document.createElement('li');
        li.setAttribute('data-testid', 'msg-'+m.id);
        if (m.pinned) li.className = 'pinned';
        var head = document.createElement('div');
        head.className = 'head';
        var left = document.createElement('span');
        left.textContent = m.author + ' · ' + fmtTime(m.createdAt);
        if (m.pinned) {
          var b = document.createElement('span');
          b.className = 'badge pin';
          b.textContent = '置顶';
          left.appendChild(b);
        }
        if (m.pinned && m.expireAt) {
          var b2 = document.createElement('span');
          b2.className = 'badge expire';
          b2.setAttribute('data-testid', 'expire-badge-'+m.id);
          b2.textContent = '到期 '+fmtTime(m.expireAt);
          left.appendChild(b2);
        }
        head.appendChild(left);
        li.appendChild(head);
        var body = document.createElement('div');
        body.className = 'body';
        body.textContent = m.text;
        li.appendChild(body);

        if (u.canPin) {
          var acts = document.createElement('div');
          acts.className = 'actions';
          if (m.pinned) {
            var setExp = document.createElement('button');
            setExp.textContent = m.expireAt ? '修改到期' : '设置到期';
            setExp.setAttribute('data-testid', 'set-expire-'+m.id);
            setExp.onclick = function(){ openExpireModal(m); };
            acts.appendChild(setExp);

            if (m.expireAt) {
              var clr = document.createElement('button');
              clr.textContent = '取消到期';
              clr.setAttribute('data-testid', 'clear-expire-'+m.id);
              clr.onclick = function(){ doExpire(m.id, null); };
              acts.appendChild(clr);
            }
            var unpin = document.createElement('button');
            unpin.className = 'danger';
            unpin.textContent = '取消置顶';
            unpin.setAttribute('data-testid', 'unpin-'+m.id);
            unpin.onclick = function(){ doPin(m.id, false); };
            acts.appendChild(unpin);
          } else {
            var pin = document.createElement('button');
            pin.textContent = '置顶';
            pin.setAttribute('data-testid', 'pin-'+m.id);
            pin.onclick = function(){ doPin(m.id, true); };
            acts.appendChild(pin);
          }
          li.appendChild(acts);
        }
        ul.appendChild(li);
      });
    }).catch(function(err){
      toast('加载失败：'+(err && err.message || '未知错误'), 'err');
    });
  }

  function doPin(id, pin) {
    apiPin(id, pin).then(function(){
      toast(pin ? '已置顶' : '已取消置顶', 'ok');
      render();
    }).catch(function(err){
      toast('操作失败：'+(err && err.message || '未知错误'), 'err');
      render(); // 失败保持原状态
    });
  }

  function doExpire(id, expireAt) {
    apiExpire(id, expireAt).then(function(){
      toast(expireAt == null ? '已取消到期（保留置顶）' : '到期时间已保存', 'ok');
      closeExpireModal();
      render();
    }).catch(function(err){
      toast('操作失败：'+(err && err.message || '未知错误'), 'err');
      // 失败保持原状态：不关闭弹窗，不刷新数据变化
    });
  }

  function openExpireModal(m) {
    document.getElementById('expire-title').textContent = '为消息 #'+m.id+' 设置到期时间';
    document.getElementById('expire-input').value = m.expireAt ? toDatetimeLocal(m.expireAt) : '';
    document.getElementById('expire-modal').classList.add('show');
    document.getElementById('expire-modal').dataset.msgId = m.id;
  }
  function closeExpireModal() {
    document.getElementById('expire-modal').classList.remove('show');
  }

  // ---------- 事件 ----------
  document.getElementById('whoami').addEventListener('change', render);
  document.getElementById('send-btn').addEventListener('click', function(){
    var text = document.getElementById('new-text').value;
    var pin = document.getElementById('new-pin').checked;
    var exp = fromDatetimeLocal(document.getElementById('new-expire').value);
    apiSend(text, pin, exp).then(function(){
      toast('发送成功', 'ok');
      document.getElementById('new-text').value = '';
      document.getElementById('new-pin').checked = false;
      document.getElementById('new-expire').value = '';
      render();
    }).catch(function(err){
      toast('发送失败：'+(err && err.message || '未知错误'), 'err');
    });
  });
  document.getElementById('expire-cancel').addEventListener('click', closeExpireModal);
  document.getElementById('expire-clear').addEventListener('click', function(){
    var id = parseInt(document.getElementById('expire-modal').dataset.msgId, 10);
    doExpire(id, null);
  });
  document.getElementById('expire-save').addEventListener('click', function(){
    var id = parseInt(document.getElementById('expire-modal').dataset.msgId, 10);
    var v = fromDatetimeLocal(document.getElementById('expire-input').value);
    if (v == null) { toast('请填写到期时间', 'err'); return; }
    doExpire(id, v);
  });

  // 定时刷新，让到期能被可视化下线（本地扫或后端扫）
  setInterval(render, 3000);
  render();
})();
</script>
<footer style="padding:16px;text-align:center;font-size:12px;color:#64748b">作者：Octo 小码（runtimeId: implementation） · 独立测试角色：Octo 小检（runtimeId: verification） · PRD v2 / 候选 r1</footer></body>
</html>
