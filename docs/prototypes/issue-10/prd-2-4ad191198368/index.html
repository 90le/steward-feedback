<!doctype html>
<html lang="zh-CN">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<title>提醒稍后再提醒（snooze）原型</title>
<style>
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; color: #222; }
  header { background: #2b4b8b; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  .identity { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .identity select { padding: 4px 8px; }
  .mode-tag { font-size: 12px; padding: 2px 8px; background: #f7c948; color: #333; border-radius: 10px; }
  main { padding: 16px 20px; max-width: 960px; margin: 0 auto; }
  .now-bar { background: #fff; border: 1px solid #e3e6ea; border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .now-bar label { font-size: 13px; color: #555; }
  .now-bar input[type=datetime-local] { padding: 4px 6px; font-size: 13px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tabs button { background: #e6ebf3; border: none; padding: 6px 14px; cursor: pointer; border-radius: 4px 4px 0 0; font-size: 13px; }
  .tabs button.active { background: #fff; font-weight: bold; }
  .list { background: #fff; border: 1px solid #e3e6ea; border-radius: 0 6px 6px 6px; min-height: 240px; }
  .item { padding: 12px 14px; border-bottom: 1px solid #eef1f5; display: flex; gap: 10px; align-items: flex-start; }
  .item:last-child { border-bottom: none; }
  .item .body { flex: 1; }
  .item .meta { font-size: 12px; color: #777; margin-top: 4px; }
  .item .text { font-size: 14px; }
  .item.done .text { color: #999; text-decoration: line-through; }
  .item.snoozed { background: #fffbe8; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 8px; margin-left: 6px; vertical-align: middle; }
  .badge.snz { background: #fef3c7; color: #a26a00; }
  .badge.done { background: #dcfce7; color: #166534; }
  .badge.other { background: #e5e7eb; color: #555; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button { font-size: 12px; padding: 4px 10px; cursor: pointer; border: 1px solid #cbd2db; background: #fff; border-radius: 4px; }
  .actions button.primary { background: #2b4b8b; color: #fff; border-color: #2b4b8b; }
  .actions button:disabled { opacity: 0.4; cursor: not-allowed; }
  .toast { position: fixed; right: 20px; bottom: 20px; max-width: 320px; }
  .toast .msg { background: #fff; border: 1px solid #cbd2db; padding: 10px 14px; margin-top: 8px; border-radius: 4px; font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .toast .msg.err { border-color: #dc2626; color: #991b1b; }
  .toast .msg.ok { border-color: #16a34a; color: #14532d; }
  dialog { border: 1px solid #cbd2db; border-radius: 6px; padding: 16px; min-width: 320px; }
  dialog h3 { margin: 0 0 12px 0; font-size: 15px; }
  dialog .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  dialog .quick button { font-size: 12px; padding: 4px 10px; cursor: pointer; }
  dialog .row { margin: 8px 0; font-size: 13px; }
  dialog input[type=datetime-local] { padding: 4px 6px; font-size: 13px; width: 100%; box-sizing: border-box; }
  dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .hint { font-size: 12px; color: #666; margin: 6px 0 12px; }
  .empty { padding: 30px; text-align: center; color: #999; font-size: 13px; }
  .fail-toggle { margin-left: auto; font-size: 12px; color: #fff; }
  .fail-toggle input { vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>Octo 提醒 · 稍后再提醒原型</h1>
  <span class="mode-tag" data-testid="mode-tag" id="modeTag">模拟</span>
  <div class="identity">
    <label>当前身份：</label>
    <select data-testid="identity-switch" id="identitySwitch">
      <option value="u1">u1 · 我（Alice）</option>
      <option value="u2">u2 · 队友 Bob</option>
      <option value="u3">u3 · 队友 Carol</option>
    </select>
  </div>
  <label class="fail-toggle"><input type="checkbox" data-testid="force-fail" id="forceFail"> 模拟网络失败</label>
</header>
<main>
  <div class="now-bar">
    <label>模拟"当前时间"：</label>
    <input type="datetime-local" data-testid="now-input" id="nowInput">
    <button data-testid="now-advance-1m" id="advance1m">+1 分钟</button>
    <button data-testid="now-advance-15m" id="advance15m">+15 分钟</button>
    <button data-testid="now-refresh" id="refreshList">刷新列表</button>
    <span class="hint" id="nowHint"></span>
  </div>

  <div class="tabs">
    <button data-testid="tab-active" id="tabActive" class="active">活跃提醒</button>
    <button data-testid="tab-snoozed" id="tabSnoozed">已延后</button>
    <button data-testid="tab-done" id="tabDone">已处理</button>
    <button data-testid="tab-others" id="tabOthers">其他人视图（验证 R6/AC2/AC12）</button>
  </div>
  <div class="list" data-testid="list" id="list"></div>

  <p class="hint">
    说明：本原型演示 PRD v2 R1–R11 与 AC1–AC12。切换身份查看 R6/R11 效果；调整"当前时间"或点 +15 分钟触发到点重现（R3/AC3）。
    "模拟网络失败"用于验证 R7/AC8；不早于当前时间的选择将被拒（R8/AC7）。
  </p>
</main>

<dialog data-testid="snooze-dialog" id="snoozeDialog">
  <h3 id="dialogTitle">稍后再提醒</h3>
  <div class="quick">
    <button data-testid="quick-15m" data-min="15">15 分钟后</button>
    <button data-testid="quick-1h" data-min="60">1 小时后</button>
    <button data-testid="quick-3h" data-min="180">3 小时后</button>
    <button data-testid="quick-tomorrow" data-min="tomorrow">明早 9:00</button>
  </div>
  <div class="row">
    <label>自定义时间（必须晚于当前时间）：</label>
    <input type="datetime-local" data-testid="snooze-time-input" id="snoozeTimeInput">
  </div>
  <div class="row hint" id="dialogHint"></div>
  <div class="foot">
    <button data-testid="snooze-cancel" id="snoozeCancel">取消</button>
    <button data-testid="snooze-confirm" id="snoozeConfirm" class="primary">确定</button>
  </div>
</dialog>

<div class="toast" data-testid="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  // ==== 检测联调模式：仅当 <html data-api="1"> 时才走 fetch ====
  const API_MODE = document.documentElement.getAttribute('data-api') === '1';
  document.getElementById('modeTag').textContent = API_MODE ? '联调' : '模拟';

  // ==== 模拟"当前时间" ====
  // 使用可调时钟，便于验证 AC3/R3
  let simNowMs = Date.parse('2026-09-06T20:00:00');
  const nowInput = document.getElementById('nowInput');
  function fmtLocal(ms) {
    const d = new Date(ms);
    const p = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  nowInput.value = fmtLocal(simNowMs);
  function getNow() { return simNowMs; }
  function setNow(ms){ simNowMs = ms; nowInput.value = fmtLocal(ms); render(); }
  nowInput.addEventListener('change', () => {
    const v = Date.parse(nowInput.value);
    if (!isNaN(v)) setNow(v);
  });
  document.getElementById('advance1m').addEventListener('click', () => setNow(getNow()+60000));
  document.getElementById('advance15m').addEventListener('click', () => setNow(getNow()+15*60000));
  document.getElementById('refreshList').addEventListener('click', () => render());

  // ==== 本地模拟数据 ====
  // reminders 表示"某用户对某原消息的提醒记录"
  // 字段：id, userId(接收者), messageId(原消息), text, createdAt, status(active|done),
  //       snoozeUntil(可选 ms), viewedAt(可选 ms, 仅查看不算处理)
  const initialReminders = () => [
    { id: 'r1', userId: 'u1', messageId: 'm100', text: '张三 @你：会议纪要请今晚补齐', createdAt: Date.parse('2026-09-06T19:30:00'), status:'active' },
    { id: 'r2', userId: 'u1', messageId: 'm101', text: '李四 @你：麻烦帮忙 review PR', createdAt: Date.parse('2026-09-06T19:45:00'), status:'active' },
    { id: 'r3', userId: 'u1', messageId: 'm102', text: '王五 @你：客户反馈需要回复', createdAt: Date.parse('2026-09-06T19:55:00'), status:'active' },
    { id: 'r4', userId: 'u2', messageId: 'm100', text: '张三 @你：会议纪要请今晚补齐', createdAt: Date.parse('2026-09-06T19:30:00'), status:'active' },
    { id: 'r5', userId: 'u2', messageId: 'm200', text: '赵六 @你：设计稿评审', createdAt: Date.parse('2026-09-06T19:20:00'), status:'active' },
    { id: 'r6', userId: 'u3', messageId: 'm100', text: '张三 @你：会议纪要请今晚补齐', createdAt: Date.parse('2026-09-06T19:30:00'), status:'active' }
  ];
  let reminders = initialReminders();

  // ==== 视图状态 ====
  let currentUser = 'u1';
  let currentTab = 'active';
  let dialogTarget = null; // {mode:'set'|'edit', id}

  document.getElementById('identitySwitch').addEventListener('change', (e) => {
    currentUser = e.target.value;
    render();
  });
  ['Active','Snoozed','Done','Others'].forEach(t => {
    document.getElementById('tab'+t).addEventListener('click', () => {
      currentTab = t.toLowerCase();
      document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
      document.getElementById('tab'+t).classList.add('active');
      render();
    });
  });

  // ==== 网络失败开关（R7/AC8） ====
  const forceFail = document.getElementById('forceFail');

  // ==== Toast ====
  function toast(msg, kind) {
    const t = document.getElementById('toast');
    const el = document.createElement('div');
    el.className = 'msg ' + (kind||'');
    el.textContent = msg;
    el.setAttribute('data-testid', 'toast-msg');
    if (kind) el.setAttribute('data-kind', kind);
    t.appendChild(el);
    setTimeout(()=>{ el.remove(); }, 3500);
  }

  // ==== 后端调用封装：联调时走 fetch，本地则直接操作内存 ====
  async function api(path, opts) {
    if (!API_MODE) throw new Error('LOCAL_ONLY'); // 调用方判断
    if (forceFail.checked) {
      // 模拟网络失败
      const err = new Error('模拟网络异常');
      err.code = 'NETWORK';
      throw err;
    }
    const res = await fetch(path, opts);
    const data = await res.json().catch(()=>({}));
    if (!res.ok) {
      const err = new Error(data && data.message || ('HTTP '+res.status));
      err.code = data && data.code || 'HTTP_ERR';
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // ==== 业务动作（本地模拟版本，与后端边界规则保持一致） ====
  function localList(userId) {
    // 计算派生的"活跃/延后/已处理"
    const now = getNow();
    return reminders.filter(r => r.userId === userId).map(r => {
      const derived = { ...r };
      if (r.status === 'done') { derived.view = 'done'; }
      else if (r.snoozeUntil && r.snoozeUntil > now) { derived.view = 'snoozed'; }
      else { derived.view = 'active'; }
      return derived;
    });
  }
  function localFindOwn(id, userId) {
    const r = reminders.find(x => x.id === id);
    if (!r) return { err: { code:'NOT_FOUND', message:'提醒不存在' } };
    if (r.userId !== userId) return { err: { code:'FORBIDDEN', message:'不能对他人的提醒执行此操作' } };
    return { r };
  }
  function localSnoozeSet(id, userId, untilMs) {
    if (forceFail.checked) return { err: { code:'NETWORK', message:'模拟网络异常' } };
    const { r, err } = localFindOwn(id, userId);
    if (err) return { err };
    if (r.status === 'done') return { err: { code:'ALREADY_DONE', message:'该提醒已处理，无法设置延后' } };
    if (!(untilMs > getNow())) return { err: { code:'INVALID_TIME', message:'再次提醒时间必须晚于当前时间' } };
    r.snoozeUntil = untilMs;
    return { r };
  }
  function localSnoozeCancel(id, userId) {
    if (forceFail.checked) return { err: { code:'NETWORK', message:'模拟网络异常' } };
    const { r, err } = localFindOwn(id, userId);
    if (err) return { err };
    if (!r.snoozeUntil) return { err: { code:'NO_SNOOZE', message:'该提醒当前未设置延后' } };
    delete r.snoozeUntil;
    return { r };
  }
  function localMarkDone(id, userId) {
    if (forceFail.checked) return { err: { code:'NETWORK', message:'模拟网络异常' } };
    const { r, err } = localFindOwn(id, userId);
    if (err) return { err };
    r.status = 'done';
    // R9：明确处理后延后立即失效
    delete r.snoozeUntil;
    return { r };
  }
  function localMarkUndone(id, userId) {
    if (forceFail.checked) return { err: { code:'NETWORK', message:'模拟网络异常' } };
    const { r, err } = localFindOwn(id, userId);
    if (err) return { err };
    r.status = 'active';
    return { r };
  }
  function localView(id, userId) {
    // R10：仅查看不构成处理
    const r = reminders.find(x => x.id === id);
    if (!r || r.userId !== userId) return { err:{ code:'FORBIDDEN', message:'不能查看他人的提醒'} };
    r.viewedAt = getNow();
    return { r };
  }

  // 统一入口：联调模式尝试 API，失败或非联调走本地
  async function callList(userId) {
    if (API_MODE) {
      try {
        const data = await api(`/api/reminders?userId=${encodeURIComponent(userId)}&now=${getNow()}`);
        return { ok: data.reminders };
      } catch (e) {
        return { err: { code: e.code||'ERR', message: e.message } };
      }
    }
    return { ok: localList(userId) };
  }
  async function callSnoozeSet(id, userId, untilMs) {
    if (API_MODE) {
      try {
        const data = await api(`/api/reminders/${encodeURIComponent(id)}/snooze`, {
          method: 'POST',
          headers: {'Content-Type':'application/json','X-User-Id':userId},
          body: JSON.stringify({ until: untilMs, now: getNow() })
        });
        return { ok: data };
      } catch (e) { return { err:{ code:e.code||'ERR', message:e.message } }; }
    }
    return localSnoozeSet(id, userId, untilMs).err
      ? { err: localSnoozeSet.__last } // never used; keep API symmetric
      : { ok: true };
  }
  // 简化重写以避免重复调用副作用
  async function doSnoozeSet(id, userId, untilMs){
    if (API_MODE) {
      try {
        const data = await api(`/api/reminders/${encodeURIComponent(id)}/snooze`, {
          method:'POST',
          headers:{'Content-Type':'application/json','X-User-Id':userId},
          body: JSON.stringify({ until: untilMs, now: getNow() })
        });
        return { ok: data };
      } catch(e) { return { err:{ code:e.code||'ERR', message:e.message } }; }
    }
    const res = localSnoozeSet(id, userId, untilMs);
    return res.err ? { err: res.err } : { ok: res.r };
  }
  async function doSnoozeCancel(id, userId){
    if (API_MODE) {
      try {
        const data = await api(`/api/reminders/${encodeURIComponent(id)}/snooze`, {
          method:'DELETE',
          headers:{'X-User-Id':userId,'X-Now': String(getNow())}
        });
        return { ok:data };
      } catch(e){ return { err:{ code:e.code||'ERR', message:e.message } }; }
    }
    const res = localSnoozeCancel(id, userId);
    return res.err ? { err:res.err } : { ok:res.r };
  }
  async function doMarkDone(id, userId){
    if (API_MODE) {
      try {
        const data = await api(`/api/reminders/${encodeURIComponent(id)}/done`, {
          method:'POST', headers:{'X-User-Id':userId,'X-Now': String(getNow())}
        });
        return { ok:data };
      } catch(e){ return { err:{ code:e.code||'ERR', message:e.message } }; }
    }
    const res = localMarkDone(id, userId);
    return res.err ? { err:res.err } : { ok:res.r };
  }
  async function doMarkUndone(id, userId){
    if (API_MODE) {
      try {
        const data = await api(`/api/reminders/${encodeURIComponent(id)}/undone`, {
          method:'POST', headers:{'X-User-Id':userId,'X-Now': String(getNow())}
        });
        return { ok:data };
      } catch(e){ return { err:{ code:e.code||'ERR', message:e.message } }; }
    }
    const res = localMarkUndone(id, userId);
    return res.err ? { err:res.err } : { ok:res.r };
  }
  async function doView(id, userId){
    if (API_MODE) {
      try {
        const data = await api(`/api/reminders/${encodeURIComponent(id)}/view`, {
          method:'POST', headers:{'X-User-Id':userId,'X-Now': String(getNow())}
        });
        return { ok:data };
      } catch(e){ return { err:{ code:e.code||'ERR', message:e.message } }; }
    }
    const res = localView(id, userId);
    return res.err ? { err:res.err } : { ok:res.r };
  }

  // ==== 渲染 ====
  async function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    document.getElementById('nowHint').textContent =
      '当前模拟时间：' + new Date(getNow()).toLocaleString();

    let viewingUser = currentUser;
    if (currentTab === 'others') {
      // "其他人视图"取一个非当前用户展示
      viewingUser = currentUser === 'u1' ? 'u2' : 'u1';
    }
    const res = await callList(viewingUser);
    if (res.err) { toast('加载失败：'+res.err.message, 'err'); return; }
    const all = res.ok;

    let items;
    if (currentTab === 'active') items = all.filter(r => r.view === 'active');
    else if (currentTab === 'snoozed') items = all.filter(r => r.view === 'snoozed');
    else if (currentTab === 'done') items = all.filter(r => r.view === 'done');
    else items = all; // others 展示全部

    if (items.length === 0) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.setAttribute('data-testid','empty');
      e.textContent = currentTab === 'others'
        ? '（该用户没有提醒）'
        : '（无提醒）';
      list.appendChild(e);
      return;
    }

    for (const r of items) {
      const item = document.createElement('div');
      item.className = 'item ' + (r.view === 'done' ? 'done' : r.view === 'snoozed' ? 'snoozed' : '');
      item.setAttribute('data-testid', 'item-' + r.id);
      item.setAttribute('data-view', r.view);
      item.setAttribute('data-owner', r.userId);

      const body = document.createElement('div');
      body.className = 'body';
      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = r.text;
      if (r.view === 'snoozed') {
        const b = document.createElement('span'); b.className='badge snz';
        b.setAttribute('data-testid','badge-snoozed-'+r.id);
        b.textContent = '延后至 ' + new Date(r.snoozeUntil).toLocaleString();
        text.appendChild(b);
      }
      if (r.view === 'done') {
        const b = document.createElement('span'); b.className='badge done';
        b.setAttribute('data-testid','badge-done-'+r.id);
        b.textContent = '已处理';
        text.appendChild(b);
      }
      if (currentTab === 'others') {
        const b = document.createElement('span'); b.className='badge other';
        b.textContent = '（属于 '+r.userId+'）';
        text.appendChild(b);
      }
      body.appendChild(text);
      const meta = document.createElement('div'); meta.className='meta';
      meta.textContent = '原消息 '+r.messageId+' · 创建于 '+new Date(r.createdAt).toLocaleString();
      if (r.viewedAt) meta.textContent += ' · 最近查看 '+new Date(r.viewedAt).toLocaleString();
      body.appendChild(meta);
      item.appendChild(body);

      // 操作区
      const acts = document.createElement('div'); acts.className='actions';
      const isOwn = r.userId === currentUser && currentTab !== 'others';

      // 查看原消息（R10：不构成处理）
      const btnView = document.createElement('button');
      btnView.textContent = '查看原消息';
      btnView.setAttribute('data-testid','act-view-'+r.id);
      btnView.addEventListener('click', async () => {
        const res = await doView(r.id, currentUser);
        if (res.err) { toast('查看失败：'+res.err.message, 'err'); return; }
        toast('已定位到原消息 '+r.messageId+'（仅查看，不改变延后/处理状态）', 'ok');
        render();
      });
      acts.appendChild(btnView);

      if (isOwn) {
        if (r.view === 'active') {
          const btnSnz = document.createElement('button');
          btnSnz.textContent = '稍后再提醒';
          btnSnz.setAttribute('data-testid','act-snooze-'+r.id);
          btnSnz.addEventListener('click', () => openDialog('set', r.id));
          acts.appendChild(btnSnz);

          const btnDone = document.createElement('button');
          btnDone.textContent = '标记已处理';
          btnDone.setAttribute('data-testid','act-done-'+r.id);
          btnDone.addEventListener('click', async () => {
            const res = await doMarkDone(r.id, currentUser);
            if (res.err) { toast('操作失败：'+res.err.message, 'err'); return; }
            toast('已标记为处理', 'ok'); render();
          });
          acts.appendChild(btnDone);
        } else if (r.view === 'snoozed') {
          const btnEdit = document.createElement('button');
          btnEdit.textContent = '修改延后时间';
          btnEdit.setAttribute('data-testid','act-edit-'+r.id);
          btnEdit.addEventListener('click', () => openDialog('edit', r.id));
          acts.appendChild(btnEdit);

          const btnCancel = document.createElement('button');
          btnCancel.textContent = '取消延后';
          btnCancel.setAttribute('data-testid','act-cancel-'+r.id);
          btnCancel.addEventListener('click', async () => {
            const res = await doSnoozeCancel(r.id, currentUser);
            if (res.err) { toast('取消失败：'+res.err.message, 'err'); return; }
            toast('已取消延后，提醒恢复为未处理', 'ok'); render();
          });
          acts.appendChild(btnCancel);

          const btnDone = document.createElement('button');
          btnDone.textContent = '标记已处理（R9）';
          btnDone.setAttribute('data-testid','act-done-'+r.id);
          btnDone.addEventListener('click', async () => {
            const res = await doMarkDone(r.id, currentUser);
            if (res.err) { toast('操作失败：'+res.err.message, 'err'); return; }
            toast('已标记处理，延后安排立即失效', 'ok'); render();
          });
          acts.appendChild(btnDone);
        } else if (r.view === 'done') {
          const btnUn = document.createElement('button');
          btnUn.textContent = '恢复未处理';
          btnUn.setAttribute('data-testid','act-undone-'+r.id);
          btnUn.addEventListener('click', async () => {
            const res = await doMarkUndone(r.id, currentUser);
            if (res.err) { toast('操作失败：'+res.err.message, 'err'); return; }
            toast('已恢复未处理', 'ok'); render();
          });
          acts.appendChild(btnUn);
        }
      } else {
        // 他人的提醒：入口不可用（AC9）
        const note = document.createElement('span');
        note.className = 'hint';
        note.setAttribute('data-testid','no-permission-'+r.id);
        note.textContent = '（他人的提醒不提供延后/处理入口）';
        acts.appendChild(note);
      }

      item.appendChild(acts);
      list.appendChild(item);
    }
  }

  // ==== 对话框 ====
  const dlg = document.getElementById('snoozeDialog');
  const dlgHint = document.getElementById('dialogHint');
  const snoozeInput = document.getElementById('snoozeTimeInput');
  function openDialog(mode, id) {
    dialogTarget = { mode, id };
    const r = reminders.find(x=>x.id===id);
    document.getElementById('dialogTitle').textContent =
      (mode === 'edit' ? '修改延后时间：' : '稍后再提醒：') + (r ? r.text.slice(0,20)+'…' : '');
    const base = mode === 'edit' && r && r.snoozeUntil ? r.snoozeUntil : (getNow() + 15*60000);
    snoozeInput.value = fmtLocal(base);
    dlgHint.textContent = '当前模拟时间：' + new Date(getNow()).toLocaleString();
    if (typeof dlg.showModal === 'function') dlg.showModal();
    else dlg.setAttribute('open','');
  }
  document.querySelectorAll('#snoozeDialog .quick button').forEach(b => {
    b.addEventListener('click', () => {
      const key = b.getAttribute('data-min');
      let target;
      if (key === 'tomorrow') {
        const d = new Date(getNow());
        d.setDate(d.getDate()+1); d.setHours(9,0,0,0);
        target = d.getTime();
      } else {
        target = getNow() + Number(key) * 60000;
      }
      snoozeInput.value = fmtLocal(target);
    });
  });
  document.getElementById('snoozeCancel').addEventListener('click', () => dlg.close());
  document.getElementById('snoozeConfirm').addEventListener('click', async () => {
    if (!dialogTarget) return;
    const ms = Date.parse(snoozeInput.value);
    if (isNaN(ms)) { toast('请输入合法的时间', 'err'); return; }
    // 前端先做一次校验，但服务端仍会独立校验（R8/AC7）
    if (!(ms > getNow())) {
      toast('再次提醒时间必须晚于当前时间（R8/AC7）', 'err');
      return;
    }
    const res = await doSnoozeSet(dialogTarget.id, currentUser, ms);
    if (res.err) {
      toast('设置失败：'+res.err.message+'（提醒保持原状态）', 'err');
      return;
    }
    toast(dialogTarget.mode === 'edit' ? '延后时间已更新' : '已设置稍后再提醒', 'ok');
    dlg.close();
    render();
  });

  // 首次渲染
  render();
})();
</script>
