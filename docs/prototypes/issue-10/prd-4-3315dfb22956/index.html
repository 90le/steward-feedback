<!doctype html>
<html lang="zh-CN">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<title>提醒稍后再提醒 - 演示原型 v4</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --border:#e3e5eb; --text:#1f2328; --muted:#6b7280; --primary:#2f6feb; --danger:#c2410c; --ok:#0f766e; --warn:#a16207; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
  header{background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  header h1{margin:0;font-size:16px;font-weight:600}
  .mode-tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#eef2ff;color:#3730a3}
  .mode-tag.api{background:#dcfce7;color:#166534}
  main{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:960px){main{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px}
  .panel h2{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select,input,button{font:inherit;border:1px solid var(--border);border-radius:6px;padding:6px 10px;background:#fff;color:inherit}
  button{cursor:pointer;background:#f8fafc}
  button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
  button.danger{background:#fff;color:var(--danger);border-color:#fecaca}
  button:disabled{opacity:.55;cursor:not-allowed}
  .muted{color:var(--muted);font-size:12px}
  ul.reminders{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
  li.reminder{border:1px solid var(--border);border-radius:6px;padding:10px;background:#fff}
  li.reminder .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  li.reminder .meta{color:var(--muted);font-size:12px;margin-top:2px}
  li.reminder .actions{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
  .b-active{background:#fee2e2;color:#991b1b}
  .b-snooze{background:#fef3c7;color:#92400e}
  .b-done{background:#dcfce7;color:#166534}
  .b-mine{background:#e0e7ff;color:#3730a3;margin-left:6px}
  .b-other{background:#f3f4f6;color:#4b5563;margin-left:6px}
  .toast-wrap{position:fixed;right:16px;top:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
  .toast{background:#111827;color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:320px}
  .toast.ok{background:var(--ok)}
  .toast.err{background:var(--danger)}
  .toast.warn{background:var(--warn)}
  .snooze-form{margin-top:8px;padding:8px;background:#f8fafc;border:1px dashed var(--border);border-radius:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .msg-view{margin-top:8px;padding:10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px}
  .msg-view .loc{color:#1e40af;font-weight:600;margin-bottom:4px;font-size:12px}
  .msg-view .content{background:#fff;padding:8px;border-radius:4px;border:1px solid #dbeafe}
  .msg-view .content .hl{background:#fef08a;padding:0 2px;border-radius:2px}
  .clock{font-family:ui-monospace,monospace;background:#f3f4f6;padding:3px 8px;border-radius:4px;font-size:12px}
  .empty{color:var(--muted);text-align:center;padding:18px 6px;font-style:italic}
  .conv-msg{padding:6px 8px;border-radius:4px;margin-bottom:4px;border:1px solid transparent}
  .conv-msg.hl{background:#fef9c3;border-color:#fde68a}
  .conv-msg .who{font-weight:600;font-size:12px;color:#374151}
  .conv-msg .txt{font-size:13px}
  details.diag{margin-top:10px}
  details.diag summary{cursor:pointer;color:var(--muted);font-size:12px}
  details.diag pre{background:#0b1020;color:#e5e7eb;padding:8px;border-radius:6px;font-size:12px;overflow:auto;max-height:200px}
</style>
</head>
<body>
<header>
  <h1>提醒 · 稍后再提醒（v4 演示）</h1>
  <span id="mode-tag" class="mode-tag" data-testid="mode-tag">本地模拟</span>
  <div class="row" style="margin-left:auto">
    <label class="muted">当前身份</label>
    <select id="user-switch" data-testid="user-switch">
      <option value="u_alice">Alice（本人）</option>
      <option value="u_bob">Bob（其他成员）</option>
    </select>
    <span class="muted">当前时间</span>
    <span id="clock" class="clock" data-testid="clock">--:--:--</span>
    <button id="refresh-btn" data-testid="refresh-btn">刷新</button>
    <button id="reset-btn" class="danger" data-testid="reset-btn" title="重置演示数据">重置</button>
  </div>
</header>
<div class="toast-wrap" id="toasts" data-testid="toasts"></div>
<main>
  <section class="panel">
    <h2>我的提醒列表 <span class="muted" id="list-owner" data-testid="list-owner"></span></h2>
    <ul class="reminders" id="reminder-list" data-testid="reminder-list"></ul>
    <details class="diag"><summary>调试信息</summary><pre id="diag" data-testid="diag"></pre></details>
  </section>
  <section class="panel">
    <h2>原会话（群：项目讨论）</h2>
    <p class="muted">左侧点击"查看原消息"会在此处真实展示并高亮定位。</p>
    <div id="conversation" data-testid="conversation"></div>
    <div id="located" data-testid="located" style="margin-top:8px"></div>
  </section>
</main>

<script>
"use strict";
(function(){
  const MODE_API = document.documentElement.hasAttribute('data-api') || document.body.hasAttribute('data-api') || document.querySelector('html[data-api]') !== null;
  // The server sets data-api on the <html> tag; check root element:
  const hasApi = document.documentElement.getAttribute('data-api') === '1';
  const useApi = hasApi;

  const modeTag = document.getElementById('mode-tag');
  modeTag.textContent = useApi ? '联调（服务器）' : '本地模拟';
  if (useApi) modeTag.classList.add('api');

  // ---------- Local mock store (used only when !useApi) ----------
  const now = () => Date.now();
  function seedData() {
    const t0 = now();
    return {
      messages: [
        { id:'m_1', author:'Carol', text:'@Alice 麻烦看下昨天的报表格式', ts: t0 - 600000 },
        { id:'m_2', author:'Dave', text:'大家好，午饭一起？', ts: t0 - 500000 },
        { id:'m_3', author:'Carol', text:'@Bob 帮忙 review 一下 PR', ts: t0 - 400000 },
        { id:'m_4', author:'Eve', text:'@Alice @Bob 周会挪到下午 3 点', ts: t0 - 300000 },
      ],
      reminders: [
        // 每条 reminder 只属于一位成员；同一原消息可以对不同成员各生成一条
        { id:'r_a1', userId:'u_alice', messageId:'m_1', status:'active', snoozeUntil:null, createdAt:t0-600000 },
        { id:'r_a2', userId:'u_alice', messageId:'m_4', status:'active', snoozeUntil:null, createdAt:t0-300000 },
        { id:'r_b1', userId:'u_bob',   messageId:'m_3', status:'active', snoozeUntil:null, createdAt:t0-400000 },
        { id:'r_b2', userId:'u_bob',   messageId:'m_4', status:'active', snoozeUntil:null, createdAt:t0-300000 },
      ]
    };
  }
  let local = seedData();
  function localApi(op, payload) {
    // Emulate server semantics. Returns { ok, data | error }
    const uid = payload && payload.actingUserId;
    if (op === 'list') {
      // Recompute virtual status: if snoozeUntil exists and reached, treat as active again.
      const list = local.reminders
        .filter(r => r.userId === uid)
        .map(r => materialize(r));
      return { ok:true, data:{ reminders:list, serverNow:now() } };
    }
    if (op === 'snooze') {
      const r = local.reminders.find(x => x.id === payload.reminderId);
      if (!r) return { ok:false, error:{ code:'not_found', msg:'提醒不存在' } };
      if (r.userId !== uid) return { ok:false, error:{ code:'forbidden', msg:'不能对他人的提醒操作' } };
      if (r.status === 'done') return { ok:false, error:{ code:'invalid_state', msg:'该提醒已处理' } };
      const until = Number(payload.snoozeUntil);
      if (!Number.isFinite(until) || until <= now()) return { ok:false, error:{ code:'time_invalid', msg:'再次提醒时间必须晚于当前时间', serverNow:now() } };
      r.status = 'snoozed'; r.snoozeUntil = until;
      return { ok:true, data:{ reminder:materialize(r), serverNow:now() } };
    }
    if (op === 'cancelSnooze') {
      const r = local.reminders.find(x => x.id === payload.reminderId);
      if (!r) return { ok:false, error:{ code:'not_found', msg:'提醒不存在' } };
      if (r.userId !== uid) return { ok:false, error:{ code:'forbidden', msg:'不能对他人的提醒操作' } };
      if (r.status !== 'snoozed') return { ok:false, error:{ code:'invalid_state', msg:'仅延后中的提醒可取消延后' } };
      r.status = 'active'; r.snoozeUntil = null;
      return { ok:true, data:{ reminder:materialize(r), serverNow:now() } };
    }
    if (op === 'markDone') {
      const r = local.reminders.find(x => x.id === payload.reminderId);
      if (!r) return { ok:false, error:{ code:'not_found', msg:'提醒不存在' } };
      if (r.userId !== uid) return { ok:false, error:{ code:'forbidden', msg:'不能对他人的提醒操作' } };
      // 明确处理：无论 active 还是 snoozed 都可标记为 done，且取消 snooze
      r.status = 'done'; r.snoozeUntil = null;
      return { ok:true, data:{ reminder:materialize(r), serverNow:now() } };
    }
    if (op === 'viewMessage') {
      const r = local.reminders.find(x => x.id === payload.reminderId);
      if (!r) return { ok:false, error:{ code:'not_found', msg:'提醒不存在' } };
      if (r.userId !== uid) return { ok:false, error:{ code:'forbidden', msg:'不能查看他人提醒对应的消息' } };
      const m = local.messages.find(x => x.id === r.messageId);
      if (!m) return { ok:false, error:{ code:'not_found', msg:'原消息不存在' } };
      return { ok:true, data:{ message:m, conversation:local.messages, serverNow:now() } };
    }
    if (op === 'reset') { local = seedData(); return { ok:true, data:{ serverNow:now() } }; }
    return { ok:false, error:{ code:'bad_op', msg:'未知操作' } };
  }
  function materialize(r) {
    const copy = { ...r };
    // 视图状态由服务器真实状态派生
    if (copy.status === 'snoozed' && copy.snoozeUntil && copy.snoozeUntil <= now()) {
      // 到点重现：真实状态仍是 snoozed（未被明确处理），但视图应展示为 active
      copy.viewStatus = 'active';
      copy.reemerged = true;
    } else {
      copy.viewStatus = copy.status;
      copy.reemerged = false;
    }
    return copy;
  }

  async function call(op, payload) {
    if (useApi) {
      try {
        const res = await fetch('/api/'+op, { method:'POST', headers:{'Content-Type':'application/json','X-Acting-User': payload.actingUserId||''}, body: JSON.stringify(payload||{}) });
        const j = await res.json().catch(()=>({ok:false,error:{code:'parse',msg:'返回不是 JSON'}}));
        return j;
      } catch(e){
        return { ok:false, error:{ code:'network', msg:'网络错误: '+e.message } };
      }
    }
    return localApi(op, payload);
  }

  // ---------- UI state ----------
  const state = {
    currentUser: 'u_alice',
    reminders: [],
    editing: null, // reminderId being edited (snooze form open)
    viewing: null, // messageId currently viewed
    serverNow: now(),
  };
  const users = { u_alice:'Alice（本人）', u_bob:'Bob（其他成员）' };

  const $ = sel => document.querySelector(sel);
  const listEl = $('#reminder-list');
  const clockEl = $('#clock');
  const convEl = $('#conversation');
  const locEl = $('#located');
  const diagEl = $('#diag');

  function toast(msg, kind){
    const el = document.createElement('div');
    el.className = 'toast '+(kind||'');
    el.setAttribute('data-testid','toast');
    if (kind) el.setAttribute('data-toast-kind', kind);
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(()=>{ el.remove(); }, 4200);
  }
  function fmtTime(ts){
    if (!ts) return '';
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  function fmtClock(ts){
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  async function refresh(){
    const res = await call('list', { actingUserId: state.currentUser });
    if (!res.ok) { toast('刷新失败：'+(res.error && res.error.msg || '未知错误'),'err'); return; }
    state.reminders = res.data.reminders;
    state.serverNow = res.data.serverNow;
    render();
  }

  function render(){
    document.getElementById('list-owner').textContent = '（'+users[state.currentUser]+'）';
    listEl.innerHTML = '';
    if (state.reminders.length === 0){
      const li = document.createElement('li'); li.className='empty'; li.textContent='暂无提醒'; li.setAttribute('data-testid','empty');
      listEl.appendChild(li);
    }
    for (const r of state.reminders){
      const li = document.createElement('li');
      li.className = 'reminder';
      li.setAttribute('data-testid','reminder-item');
      li.setAttribute('data-reminder-id', r.id);
      li.setAttribute('data-view-status', r.viewStatus);
      li.setAttribute('data-real-status', r.status);

      const top = document.createElement('div'); top.className='top';
      const left = document.createElement('div');
      const badge = document.createElement('span');
      badge.className = 'badge ' + (r.viewStatus==='active' ? 'b-active' : r.viewStatus==='snoozed' ? 'b-snooze' : 'b-done');
      badge.setAttribute('data-testid','status-badge');
      badge.textContent = r.viewStatus==='active' ? (r.reemerged ? '未处理（已到点重现）' : '未处理') : r.viewStatus==='snoozed' ? '延后中' : '已处理';
      left.appendChild(badge);
      const owner = document.createElement('span'); owner.className='badge '+(r.userId===state.currentUser?'b-mine':'b-other');
      owner.textContent = r.userId===state.currentUser ? '属于我' : ('属于 '+ (users[r.userId]||r.userId));
      left.appendChild(owner);

      const title = document.createElement('div'); title.style.marginTop='4px';
      title.textContent = '来自消息：'+ r.messageId;
      left.appendChild(title);

      const meta = document.createElement('div'); meta.className='meta';
      let metaTxt = '创建时间：' + fmtTime(r.createdAt);
      if (r.snoozeUntil) metaTxt += ' · 再次提醒：' + fmtTime(r.snoozeUntil);
      meta.textContent = metaTxt;
      meta.setAttribute('data-testid','reminder-meta');
      left.appendChild(meta);
      top.appendChild(left);

      const actions = document.createElement('div'); actions.className='actions';

      // 查看原消息（属于我的提醒才提供）
      if (r.userId === state.currentUser) {
        const viewBtn = document.createElement('button');
        viewBtn.textContent = '查看原消息';
        viewBtn.setAttribute('data-testid','view-msg-btn');
        viewBtn.addEventListener('click', ()=>viewMessage(r.id));
        actions.appendChild(viewBtn);

        if (r.viewStatus === 'active') {
          const snz = document.createElement('button');
          snz.textContent = '稍后再提醒';
          snz.className='primary';
          snz.setAttribute('data-testid','open-snooze-btn');
          snz.addEventListener('click', ()=>{ state.editing = r.id; render(); });
          actions.appendChild(snz);

          const doneBtn = document.createElement('button');
          doneBtn.textContent = '标记为已处理';
          doneBtn.setAttribute('data-testid','mark-done-btn');
          doneBtn.addEventListener('click', ()=>markDone(r.id));
          actions.appendChild(doneBtn);
        } else if (r.status === 'snoozed') {
          const edit = document.createElement('button');
          edit.textContent = '修改延后时间';
          edit.setAttribute('data-testid','edit-snooze-btn');
          edit.addEventListener('click', ()=>{ state.editing = r.id; render(); });
          actions.appendChild(edit);

          const cancel = document.createElement('button');
          cancel.textContent = '取消延后';
          cancel.setAttribute('data-testid','cancel-snooze-btn');
          cancel.addEventListener('click', ()=>cancelSnooze(r.id));
          actions.appendChild(cancel);

          const doneBtn = document.createElement('button');
          doneBtn.textContent = '标记为已处理';
          doneBtn.setAttribute('data-testid','mark-done-btn');
          doneBtn.addEventListener('click', ()=>markDone(r.id));
          actions.appendChild(doneBtn);
        }
      } else {
        const note = document.createElement('span'); note.className='muted'; note.textContent='（不属于本人，无可用操作）';
        note.setAttribute('data-testid','not-mine');
        actions.appendChild(note);
      }
      top.appendChild(actions);
      li.appendChild(top);

      if (state.editing === r.id && r.userId === state.currentUser) {
        const form = document.createElement('div'); form.className='snooze-form';
        form.setAttribute('data-testid','snooze-form');
        const label = document.createElement('span'); label.className='muted'; label.textContent='快捷：';
        form.appendChild(label);
        for (const q of [{k:'15分钟',m:15},{k:'1小时',m:60},{k:'明早9点',m:'tomorrow9'}]){
          const b = document.createElement('button');
          b.textContent = q.k;
          b.setAttribute('data-testid','preset-'+q.m);
          b.addEventListener('click', ()=>doSnooze(r.id, presetToTs(q.m)));
          form.appendChild(b);
        }
        const dt = document.createElement('input');
        dt.type='datetime-local';
        dt.setAttribute('data-testid','custom-time');
        // 默认 15 分钟后
        dt.value = tsToLocalInput(state.serverNow + 15*60*1000);
        form.appendChild(dt);
        const ok = document.createElement('button'); ok.className='primary'; ok.textContent='确定'; ok.setAttribute('data-testid','confirm-snooze-btn');
        ok.addEventListener('click', ()=>{
          const t = localInputToTs(dt.value);
          if (!Number.isFinite(t)) { toast('时间格式无效','err'); return; }
          doSnooze(r.id, t);
        });
        form.appendChild(ok);
        const no = document.createElement('button'); no.textContent='取消'; no.setAttribute('data-testid','close-snooze-btn');
        no.addEventListener('click', ()=>{ state.editing = null; render(); });
        form.appendChild(no);
        li.appendChild(form);
      }

      listEl.appendChild(li);
    }

    // debug
    diagEl.textContent = JSON.stringify({ mode: useApi?'api':'local', user: state.currentUser, serverNow: fmtTime(state.serverNow), reminders: state.reminders }, null, 2);
  }

  function presetToTs(m){
    if (m === 'tomorrow9'){
      const d = new Date(state.serverNow);
      d.setDate(d.getDate()+1); d.setHours(9,0,0,0);
      return d.getTime();
    }
    return state.serverNow + m*60*1000;
  }
  function tsToLocalInput(ts){
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function localInputToTs(v){
    if (!v) return NaN;
    const d = new Date(v);
    return d.getTime();
  }

  async function doSnooze(reminderId, until){
    const res = await call('snooze', { actingUserId: state.currentUser, reminderId, snoozeUntil: until });
    if (!res.ok) {
      if (res.error && res.error.code === 'time_invalid') {
        toast('设置未生效：'+res.error.msg+'（服务器当前时间 '+fmtTime(res.error.serverNow||state.serverNow)+'）','err');
        // 保持原状态：以最新服务器状态刷新
        await refresh();
        return;
      }
      toast('设置未生效：'+(res.error && res.error.msg || '未知错误'),'err');
      await refresh();
      return;
    }
    toast('已设置稍后再提醒，将于 '+fmtTime(until)+' 重现','ok');
    state.editing = null;
    await refresh();
  }
  async function cancelSnooze(reminderId){
    const res = await call('cancelSnooze', { actingUserId: state.currentUser, reminderId });
    if (!res.ok){ toast('取消未生效：'+(res.error && res.error.msg||'未知错误'),'err'); await refresh(); return; }
    toast('已取消延后，提醒已恢复为未处理','ok');
    await refresh();
  }
  async function markDone(reminderId){
    const res = await call('markDone', { actingUserId: state.currentUser, reminderId });
    if (!res.ok){ toast('标记未生效：'+(res.error && res.error.msg||'未知错误'),'err'); await refresh(); return; }
    toast('已标记为已处理','ok');
    await refresh();
  }
  async function viewMessage(reminderId){
    const res = await call('viewMessage', { actingUserId: state.currentUser, reminderId });
    if (!res.ok){ toast('查看失败：'+(res.error && res.error.msg||'未知错误'),'err'); return; }
    const msg = res.data.message;
    const conv = res.data.conversation;
    // 展示会话上下文并高亮定位；不改变提醒任何状态
    convEl.innerHTML = '';
    for (const m of conv){
      const row = document.createElement('div');
      row.className='conv-msg' + (m.id===msg.id?' hl':'');
      row.setAttribute('data-testid','conv-msg');
      row.setAttribute('data-message-id', m.id);
      if (m.id===msg.id) row.setAttribute('data-highlight','1');
      const who = document.createElement('div'); who.className='who'; who.textContent = m.author + ' · ' + fmtTime(m.ts);
      const txt = document.createElement('div'); txt.className='txt'; txt.textContent = m.text;
      row.appendChild(who); row.appendChild(txt);
      convEl.appendChild(row);
    }
    locEl.innerHTML = '';
    const box = document.createElement('div'); box.className='msg-view'; box.setAttribute('data-testid','msg-view');
    const loc = document.createElement('div'); loc.className='loc'; loc.textContent = '已定位到原消息 · 群「项目讨论」';
    const cont = document.createElement('div'); cont.className='content';
    const hl = document.createElement('span'); hl.className='hl'; hl.textContent = msg.text;
    cont.appendChild(document.createTextNode(msg.author+'：')); cont.appendChild(hl);
    box.appendChild(loc); box.appendChild(cont);
    locEl.appendChild(box);
    // 滚动可视
    const target = convEl.querySelector('[data-highlight="1"]');
    if (target && target.scrollIntoView) target.scrollIntoView({ block:'nearest' });
    toast('已定位到原消息','ok');
  }

  // clock
  function tickClock(){ clockEl.textContent = fmtClock(now()); }
  setInterval(tickClock, 1000); tickClock();
  // 到点重现：定期刷新以让 snoozed 到期变 active
  setInterval(()=>{ refresh().catch(()=>{}); }, 3000);

  // events
  document.getElementById('user-switch').addEventListener('change', async (e)=>{
    state.currentUser = e.target.value;
    state.editing = null;
    // 切换身份：清空会话预览避免误导
    convEl.innerHTML = ''; locEl.innerHTML = '';
    await refresh();
  });
  document.getElementById('refresh-btn').addEventListener('click', ()=>refresh());
  document.getElementById('reset-btn').addEventListener('click', async ()=>{
    const res = await call('reset', { actingUserId: state.currentUser });
    if (!res.ok){ toast('重置失败','err'); return; }
    toast('已重置演示数据','warn');
    convEl.innerHTML = ''; locEl.innerHTML = '';
    await refresh();
  });

  refresh();
})();
</script>
