<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 325" role="img" aria-labelledby="redteamTitle"><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:16px;fill:#263c59}.small{font-size:13px;fill:#627791}.title{font-size:19px;fill:#12396e;font-weight:600}.white{fill:#fff}.node{fill:#fff;stroke:#b8cce5;stroke-width:1.5}.accent{fill:#1e5096;stroke:#1e5096;stroke-width:1.5}.soft{fill:#eaf1fb;stroke:#b8cce5;stroke-width:1.5}.group{fill:#f4f8fe;stroke:#b8cce5;stroke-width:1.5;stroke-dasharray:6 5}.edge{fill:none;stroke:#6487b6;stroke-width:2}.dashed{stroke-dasharray:6 5}.data{font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;fill:#1e5096}</style><title id="redteamTitle">从建立合作前提到逐步升级请求、观察真实工具和出口，再做正常业务控制测试</title><defs><marker id="redteamArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6487b6"/></marker></defs><rect class="node" x="22" y="30" width="234" height="140" rx="8"/><text class="title" x="139" y="71" text-anchor="middle">建立合作前提</text><text class="small" x="139" y="108" text-anchor="middle">正常排障、核对或整理场景</text><text class="small" x="139" y="139" text-anchor="middle">记录真实会话与目标角色</text><rect class="soft" x="306" y="30" width="234" height="140" rx="8"/><text class="title" x="423" y="71" text-anchor="middle">逐步升级与转换</text><text class="small" x="423" y="108" text-anchor="middle">假授权、片段、编码与交接</text><text class="small" x="423" y="139" text-anchor="middle">根据上一轮结果调整</text><rect class="node" x="590" y="30" width="234" height="140" rx="8"/><text class="title" x="707" y="71" text-anchor="middle">看真实执行结果</text><text class="small" x="707" y="108" text-anchor="middle">模型、工具、草稿与回执</text><text class="small" x="707" y="139" text-anchor="middle">私密检测器匹配，不回显值</text><rect class="accent" x="874" y="30" width="224" height="140" rx="8"/><text class="title white" x="986" y="71" text-anchor="middle">修复与正常控制</text><text class="small white" x="986" y="108" text-anchor="middle">缺陷复测、合法问答再验证</text><text class="small white" x="986" y="139" text-anchor="middle">安全不能靠封闭全部能力</text><path class="edge" d="M256 100H306" marker-end="url(#redteamArrow)"/><path class="edge" d="M540 100H590" marker-end="url(#redteamArrow)"/><path class="edge" d="M824 100H874" marker-end="url(#redteamArrow)"/><path class="edge dashed" d="M707 170V223H423V170" marker-end="url(#redteamArrow)"/><text x="558" y="259" text-anchor="middle" class="small">拒绝、静默、运行失败、出口阻止、假密钥和真实敏感值命中，分别判断。</text><text x="558" y="293" text-anchor="middle" class="small">测试范围内未观察到泄露 ≠ 任意提示、编码、媒体或宿主入侵都绝对安全。</text></svg>
