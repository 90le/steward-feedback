<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="originTitle"><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:16px;fill:#263c59}.small{font-size:13px;fill:#627791}.title{font-size:19px;fill:#12396e;font-weight:600}.white{fill:#fff}.node{fill:#fff;stroke:#b8cce5;stroke-width:1.5}.accent{fill:#1e5096;stroke:#1e5096;stroke-width:1.5}.soft{fill:#eaf1fb;stroke:#b8cce5;stroke-width:1.5}.group{fill:#f4f8fe;stroke:#b8cce5;stroke-width:1.5;stroke-dasharray:6 5}.edge{fill:none;stroke:#6487b6;stroke-width:2}.dashed{stroke-dasharray:6 5}.data{font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;fill:#1e5096}</style><title id="originTitle">原消息持久化后确认接收，绑定真实Agent运行，按原来源执行并核对外部回执</title><defs><marker id="originArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6487b6"/></marker></defs><path class="edge" d="M210 92H304" marker-end="url(#originArrow)"/><path class="edge" d="M524 92H618" marker-end="url(#originArrow)"/><path class="edge" d="M838 92H922" marker-end="url(#originArrow)"/><rect class="node" x="18" y="36" width="192" height="112" rx="8"/><text class="title" x="114" y="75" text-anchor="middle">原消息</text><text class="small" x="114" y="107" text-anchor="middle">账号、会话、发送者</text><text class="small" x="114" y="131" text-anchor="middle">消息 ID、序号、提及</text><rect class="accent" x="304" y="36" width="220" height="112" rx="8"/><text class="title white" x="414" y="75" text-anchor="middle">保存与去重</text><text class="small white" x="414" y="107" text-anchor="middle">保存成功后才 ACK</text><text class="small white" x="414" y="131" text-anchor="middle">重复输入复用原记录</text><rect class="node" x="618" y="36" width="220" height="112" rx="8"/><text class="title" x="728" y="75" text-anchor="middle">绑定实际运行</text><text class="small" x="728" y="107" text-anchor="middle">指定 Agent / runId</text><text class="small" x="728" y="131" text-anchor="middle">来源、阶段与工具调用</text><rect class="soft" x="922" y="36" width="180" height="112" rx="8"/><text class="title" x="1012" y="75" text-anchor="middle">候选结果</text><text class="small" x="1012" y="107" text-anchor="middle">答复或业务产物</text><text class="small" x="1012" y="131" text-anchor="middle">仍需执行层核对</text><path class="edge" d="M1012 148V274" marker-end="url(#originArrow)"/><rect class="node" x="786" y="274" width="316" height="120" rx="8"/><text class="title" x="944" y="315" text-anchor="middle">保存意图，再执行固定目标</text><text x="944" y="347" text-anchor="middle" class="small">GitHub 或 Octo 的实际调用</text><text x="944" y="374" text-anchor="middle" class="small">正文、引用、提及由程序重建</text><rect class="node" x="402" y="274" width="306" height="120" rx="8"/><text class="title" x="555" y="315" text-anchor="middle">读回外部结果</text><text x="555" y="347" text-anchor="middle" class="small">确认：保存真实回执</text><text x="555" y="374" text-anchor="middle" class="small">不确定：沿原意图对账</text><rect class="node" x="18" y="274" width="306" height="120" rx="8"/><text class="title" x="171" y="315" text-anchor="middle">回到原来源</text><text x="171" y="347" text-anchor="middle" class="small">群提及提出者与配置观察者</text><text x="171" y="374" text-anchor="middle" class="small">私聊只回对应用户</text><path class="edge" d="M786 334H708" marker-end="url(#originArrow)"/><path class="edge" d="M402 334H324" marker-end="url(#originArrow)"/><text x="560" y="443" text-anchor="middle" class="small">输入保存、模型完成、远端写入、目标会话读回，是分别核对的阶段。</text></svg>
