<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 610" role="img" aria-labelledby="archTitle archDesc"><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:16px;fill:#263c59}.small{font-size:13px;fill:#627791}.title{font-size:19px;fill:#12396e;font-weight:600}.white{fill:#fff}.node{fill:#fff;stroke:#b8cce5;stroke-width:1.5}.accent{fill:#1e5096;stroke:#1e5096;stroke-width:1.5}.soft{fill:#eaf1fb;stroke:#b8cce5;stroke-width:1.5}.group{fill:#f4f8fe;stroke:#b8cce5;stroke-width:1.5;stroke-dasharray:6 5}.edge{fill:none;stroke:#6487b6;stroke-width:2}.dashed{stroke-dasharray:6 5}.data{font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;fill:#1e5096}</style><title id="archTitle">Steward 整体运行架构</title><desc id="archDesc">Octo 的真实消息进入 OpenClaw 内的 Steward 插件，Worker 派发五个角色，业务状态保存在 SQLite，源码和知识只读，固定适配器写入 GitHub 并回报原会话。</desc><defs><marker id="archArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6487b6"/></marker></defs><rect class="group" x="270" y="32" width="600" height="542" rx="12"/><text x="294" y="66" class="title">OpenClaw Gateway</text><rect class="node" x="16" y="132" width="205" height="162" rx="8"/><text x="118" y="174" text-anchor="middle" class="title">Octo 入口</text><text x="118" y="208" text-anchor="middle">群聊 / 私聊</text><text x="118" y="241" text-anchor="middle" class="small">可信发送者、原消息</text><text x="118" y="268" text-anchor="middle" class="small">原生 UID 提及</text><rect class="accent" x="315" y="102" width="510" height="96" rx="8"/><text x="570" y="140" text-anchor="middle" class="title white">Steward 插件与 Worker</text><text x="570" y="173" text-anchor="middle" class="white">身份与来源 · 阶段与版本 · 工具与外部效果</text><path class="edge" d="M221 181H268V150H315" marker-end="url(#archArrow)"/><text x="228" y="137" class="small">接收</text><path class="edge" d="M315 174H249V325H118V294" marker-end="url(#archArrow)"/><text x="126" y="351" class="small">按原来源回报</text><rect class="node" x="929" y="120" width="195" height="174" rx="8"/><text x="1026" y="161" text-anchor="middle" class="title">GitHub 需求池</text><text x="1026" y="195" text-anchor="middle">Issue / PRD / 评审</text><text x="1026" y="228" text-anchor="middle">演示 / 测试报告</text><text x="1026" y="267" text-anchor="middle" class="small">固定仓库与文件范围</text><path class="edge" d="M825 150H929" marker-end="url(#archArrow)"/><text x="860" y="130" class="small">受控读写</text><path class="edge" d="M570 198V232H362V262" marker-end="url(#archArrow)"/><path class="edge" d="M570 232H466V262" marker-end="url(#archArrow)"/><path class="edge" d="M570 232V262" marker-end="url(#archArrow)"/><path class="edge" d="M570 232H674V262" marker-end="url(#archArrow)"/><path class="edge" d="M674 232H778V262" marker-end="url(#archArrow)"/><rect class="node" x="315" y="262" width="94" height="91" rx="6"/><text x="362" y="296" text-anchor="middle" class="title">小丘</text><text x="362" y="328" text-anchor="middle" class="small">问答 / 收单</text><rect class="node" x="419" y="262" width="94" height="91" rx="6"/><text x="466" y="296" text-anchor="middle" class="title">小助</text><text x="466" y="328" text-anchor="middle" class="small">PRD</text><rect class="node" x="523" y="262" width="94" height="91" rx="6"/><text x="570" y="296" text-anchor="middle" class="title">小衡</text><text x="570" y="328" text-anchor="middle" class="small">独立评审</text><rect class="soft" x="627" y="262" width="94" height="91" rx="6"/><text x="674" y="296" text-anchor="middle" class="title">小码</text><text x="674" y="328" text-anchor="middle" class="small">演示开发</text><rect class="soft" x="731" y="262" width="94" height="91" rx="6"/><text x="778" y="296" text-anchor="middle" class="title">小检</text><text x="778" y="328" text-anchor="middle" class="small">实际测试</text><text x="570" y="384" text-anchor="middle" class="small">独立运行与产物；小码 / 小检使用原生 Docker 沙箱</text><path class="edge dashed" d="M315 182H289V466H315" marker-end="url(#archArrow)"/><rect class="node" x="315" y="423" width="244" height="105" rx="7"/><text x="437" y="460" text-anchor="middle" class="title">业务 SQLite</text><text x="437" y="489" text-anchor="middle" class="small">消息、任务、意图、重试、回执</text><text x="437" y="512" text-anchor="middle" class="small">重启后继续核对与处理</text><rect class="node" x="581" y="423" width="244" height="105" rx="7"/><text x="703" y="460" text-anchor="middle" class="title">源码与知识</text><text x="703" y="489" text-anchor="middle" class="small">只读快照、已发布知识包</text><text x="703" y="512" text-anchor="middle" class="small">按任务固定版本与读取证据</text><path class="edge dashed" d="M825 182H846V466H825" marker-end="url(#archArrow)"/><rect class="node" x="929" y="430" width="195" height="97" rx="7"/><text x="1026" y="466" text-anchor="middle" class="title">octo-server</text><text x="1026" y="497" text-anchor="middle" class="small">上游源码仅供只读调查</text><path class="edge" d="M929 479H825" marker-end="url(#archArrow)"/></svg>
