<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 322" role="img" aria-labelledby="recoveryTitle"><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:16px;fill:#263c59}.small{font-size:13px;fill:#627791}.title{font-size:19px;fill:#12396e;font-weight:600}.white{fill:#fff}.node{fill:#fff;stroke:#b8cce5;stroke-width:1.5}.accent{fill:#1e5096;stroke:#1e5096;stroke-width:1.5}.soft{fill:#eaf1fb;stroke:#b8cce5;stroke-width:1.5}.group{fill:#f4f8fe;stroke:#b8cce5;stroke-width:1.5;stroke-dasharray:6 5}.edge{fill:none;stroke:#6487b6;stroke-width:2}.dashed{stroke-dasharray:6 5}.data{font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;fill:#1e5096}</style><title id="recoveryTitle">限流等待与写入结果不确定的两条恢复路径</title><defs><marker id="recoveryArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6487b6"/></marker></defs><rect class="node" x="20" y="30" width="225" height="98" rx="7"/><text x="132" y="68" text-anchor="middle" class="title">真实限流响应</text><text x="132" y="103" text-anchor="middle" class="small">区别于普通权限错误</text><rect class="soft" x="302" y="30" width="225" height="98" rx="7"/><text x="414" y="68" text-anchor="middle" class="title">保存等待与意图</text><text x="414" y="103" text-anchor="middle" class="small">遵守 Retry-After / reset</text><rect class="node" x="584" y="30" width="225" height="98" rx="7"/><text x="696" y="68" text-anchor="middle" class="title">到时重新核验</text><text x="696" y="103" text-anchor="middle" class="small">检查原判断是否仍有效</text><rect class="accent" x="866" y="30" width="234" height="98" rx="7"/><text x="983" y="68" text-anchor="middle" class="title white">继续原任务</text><text x="983" y="103" text-anchor="middle" class="small white">保留原来源和真实回执</text><path class="edge" d="M245 79H302" marker-end="url(#recoveryArrow)"/><path class="edge" d="M527 79H584" marker-end="url(#recoveryArrow)"/><path class="edge" d="M809 79H866" marker-end="url(#recoveryArrow)"/><rect class="node" x="20" y="200" width="225" height="98" rx="7"/><text x="132" y="238" text-anchor="middle" class="title">写入响应丢失</text><text x="132" y="273" text-anchor="middle" class="small">远端可能已经完成</text><rect class="soft" x="302" y="200" width="225" height="98" rx="7"/><text x="414" y="238" text-anchor="middle" class="title">按原标记查结果</text><text x="414" y="273" text-anchor="middle" class="small">不直接重复 POST</text><rect class="node" x="584" y="200" width="225" height="98" rx="7"/><text x="696" y="238" text-anchor="middle" class="title">核对实际效果</text><text x="696" y="273" text-anchor="middle" class="small">确认回执或保留不确定</text><rect class="node" x="866" y="200" width="234" height="98" rx="7"/><text x="983" y="238" text-anchor="middle" class="title">按结果恢复</text><text x="983" y="273" text-anchor="middle" class="small">不把等待说成已完成</text><path class="edge" d="M245 249H302" marker-end="url(#recoveryArrow)"/><path class="edge" d="M527 249H584" marker-end="url(#recoveryArrow)"/><path class="edge" d="M809 249H866" marker-end="url(#recoveryArrow)"/></svg>
