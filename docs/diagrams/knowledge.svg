<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 414" role="img" aria-labelledby="knowledgeTitle"><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:16px;fill:#263c59}.small{font-size:13px;fill:#627791}.title{font-size:19px;fill:#12396e;font-weight:600}.white{fill:#fff}.node{fill:#fff;stroke:#b8cce5;stroke-width:1.5}.accent{fill:#1e5096;stroke:#1e5096;stroke-width:1.5}.soft{fill:#eaf1fb;stroke:#b8cce5;stroke-width:1.5}.group{fill:#f4f8fe;stroke:#b8cce5;stroke-width:1.5;stroke-dasharray:6 5}.edge{fill:none;stroke:#6487b6;stroke-width:2}.dashed{stroke-dasharray:6 5}.data{font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;fill:#1e5096}</style><title id="knowledgeTitle">源码变化后旧知识失效，新任务固定新源码，独立重审后整体发布</title><defs><marker id="knowledgeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6487b6"/></marker></defs><rect class="node" x="24" y="34" width="242" height="110" rx="8"/><text x="145" y="74" text-anchor="middle" class="title">观察到源码 B</text><text x="145" y="112" text-anchor="middle" class="small">先记录已观察的上游提交</text><rect class="soft" x="298" y="34" width="242" height="110" rx="8"/><text x="419" y="74" text-anchor="middle" class="title">旧知识待复核</text><text x="419" y="112" text-anchor="middle" class="small">不再冒称对当前版本已核验</text><rect class="node" x="572" y="34" width="242" height="110" rx="8"/><text x="693" y="74" text-anchor="middle" class="title">新任务固定 B</text><text x="693" y="112" text-anchor="middle" class="small">确认可读后，以本轮源码取证</text><rect class="node" x="846" y="34" width="250" height="110" rx="8"/><text x="971" y="74" text-anchor="middle" class="title">旧任务继续 A</text><text x="971" y="112" text-anchor="middle" class="small">本轮证据不混入新提交</text><path class="edge" d="M266 89H298" marker-end="url(#knowledgeArrow)"/><path class="edge" d="M540 89H572" marker-end="url(#knowledgeArrow)"/><rect class="node" x="298" y="244" width="242" height="110" rx="8"/><text x="419" y="284" text-anchor="middle" class="title">小助重新调查</text><text x="419" y="322" text-anchor="middle" class="small">修订结论与适用条件</text><rect class="node" x="572" y="244" width="242" height="110" rx="8"/><text x="693" y="284" text-anchor="middle" class="title">小衡独立内容审核</text><text x="693" y="322" text-anchor="middle" class="small">机器校验与相关回归分开记录</text><rect class="accent" x="846" y="244" width="250" height="110" rx="8"/><text x="971" y="284" text-anchor="middle" class="title white">整体发布知识包</text><text x="971" y="322" text-anchor="middle" class="small white">后续任务读取同一完整版本</text><path class="edge" d="M419 144V244" marker-end="url(#knowledgeArrow)"/><path class="edge" d="M540 299H572" marker-end="url(#knowledgeArrow)"/><path class="edge" d="M814 299H846" marker-end="url(#knowledgeArrow)"/><text x="48" y="251" class="small">刷新或审核失败：</text><text x="48" y="280" class="small">保留已知版本与具体缺口</text><text x="48" y="309" class="small">不刷新成功核验时间</text><text x="560" y="392" text-anchor="middle" class="small">审核 B 期间上游到 C：最多标为已核验 B，C 继续待复核；不能把 B 当作当前 C。</text></svg>
