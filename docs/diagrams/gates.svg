<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 228" role="img" aria-labelledby="gateTitle"><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:16px;fill:#263c59}.small{font-size:13px;fill:#627791}.title{font-size:19px;fill:#12396e;font-weight:600}.white{fill:#fff}.node{fill:#fff;stroke:#b8cce5;stroke-width:1.5}.accent{fill:#1e5096;stroke:#1e5096;stroke-width:1.5}.soft{fill:#eaf1fb;stroke:#b8cce5;stroke-width:1.5}.group{fill:#f4f8fe;stroke:#b8cce5;stroke-width:1.5;stroke-dasharray:6 5}.edge{fill:none;stroke:#6487b6;stroke-width:2}.dashed{stroke-dasharray:6 5}.data{font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;fill:#1e5096}</style><title id="gateTitle">从有效查重、独立评审、实际测试到确认外部回执的四个检查关口</title><defs><marker id="gateArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6487b6"/></marker></defs><path class="edge" d="M255 97H300" marker-end="url(#gateArrow)"/><path class="edge" d="M530 97H575" marker-end="url(#gateArrow)"/><path class="edge" d="M805 97H850" marker-end="url(#gateArrow)"/><rect class="node" x="25" y="30" width="230" height="142" rx="8"/><text x="140" y="63" text-anchor="middle" class="small">建单前</text><text x="140" y="100" text-anchor="middle" class="title">有效查重依据</text><text x="140" y="137" text-anchor="middle" class="small">缺依据：保存意图，待核对</text><rect class="node" x="300" y="30" width="230" height="142" rx="8"/><text x="415" y="63" text-anchor="middle" class="small">PRD 就绪前</text><text x="415" y="100" text-anchor="middle" class="title">独立评审本版本</text><text x="415" y="137" text-anchor="middle" class="small">未通过：修订或明确求助</text><rect class="soft" x="575" y="30" width="230" height="142" rx="8"/><text x="690" y="63" text-anchor="middle" class="small">演示发布前</text><text x="690" y="100" text-anchor="middle" class="title">实际测试与复核</text><text x="690" y="137" text-anchor="middle" class="small">不接受自称测试通过</text><rect class="accent" x="850" y="30" width="230" height="142" rx="8"/><text x="965" y="63" text-anchor="middle" class="small white">确认送达前</text><text x="965" y="100" text-anchor="middle" class="title white">真实外部回执</text><text x="965" y="137" text-anchor="middle" class="small white">不确定：先核对原效果</text><text x="560" y="208" text-anchor="middle" class="small">图示表示必要条件；条件未满足时可以澄清、等待、修订或阻塞，不是盲目重跑全部流程。</text></svg>
