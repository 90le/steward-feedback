<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 630" role="img" aria-labelledby="executionBoundariesTitle"><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:16px;fill:#263c59}.small{font-size:13px;fill:#627791}.title{font-size:19px;fill:#12396e;font-weight:600}.white{fill:#fff}.node{fill:#fff;stroke:#b8cce5;stroke-width:1.5}.accent{fill:#1e5096;stroke:#1e5096;stroke-width:1.5}.soft{fill:#eaf1fb;stroke:#b8cce5;stroke-width:1.5}.group{fill:#f4f8fe;stroke:#b8cce5;stroke-width:1.5;stroke-dasharray:6 5}.edge{fill:none;stroke:#6487b6;stroke-width:2}.dashed{stroke-dasharray:6 5}.data{font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;fill:#1e5096}</style><title id="executionBoundariesTitle">Agent 容器、宿主业务插件与用户浏览器的三种边界</title><defs><marker id="boundaryArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6487b6"/></marker></defs>
<rect class="group" x="22" y="44" width="316" height="472" rx="12"/><rect class="group" x="420" y="44" width="316" height="472" rx="12"/><rect class="group" x="818" y="44" width="320" height="472" rx="12"/>
<text class="title" x="180" y="27" text-anchor="middle">01 · Agent 命令环境</text><text class="title" x="578" y="27" text-anchor="middle">02 · 宿主业务程序</text><text class="title" x="978" y="27" text-anchor="middle">03 · 用户浏览器</text>
<rect class="node" x="44" y="74" width="272" height="102" rx="7"/><text class="title" x="180" y="110" text-anchor="middle">小码 / 小检</text><text x="180" y="146" text-anchor="middle">原生 Docker 中开发和测试</text>
<rect class="soft" x="44" y="204" width="272" height="138" rx="7"/><text x="64" y="238">只读：源码、设置、冻结候选</text><text x="64" y="274">可写：本角色产物与临时文件</text><text x="64" y="310">不挂载：凭证、宿主控制接口</text>
<text class="small" x="64" y="386">非 root · 只读根目录 · 限制资源</text><text class="small" x="64" y="416">沙箱后端失效时拒绝执行</text><text class="small" x="64" y="446">当前产物目录按角色共享</text><text class="small" x="64" y="476">不能宣称会话之间文件互相保密</text>
<rect class="node" x="442" y="74" width="272" height="102" rx="7"/><text class="title" x="578" y="110" text-anchor="middle">可信收集与发布代码</text><text x="578" y="146" text-anchor="middle">不在 Agent 容器的保护范围内</text>
<rect class="soft" x="442" y="204" width="272" height="138" rx="7"/><text x="462" y="238">稳定文件句柄 · 拒绝目录链接</text><text x="462" y="274">冻结内容 · 检查版本与测试</text><text x="462" y="310">发布前检查正文与文件明文</text>
<text class="small" x="462" y="386">固定仓库和允许路径</text><text class="small" x="462" y="416">真实原消息、收件人由程序注入</text><text class="small" x="462" y="446">原始候选与安全包装分别留存</text><text class="small" x="462" y="476">写入结果不确定时先核对远端</text>
<rect class="accent" x="840" y="74" width="276" height="102" rx="7"/><text class="title white" x="978" y="110" text-anchor="middle">可信预览外壳</text><text class="white" x="978" y="146" text-anchor="middle">限制生成脚本可做的事情</text>
<rect class="node" x="858" y="202" width="240" height="140" rx="7"/><text class="title" x="978" y="236" text-anchor="middle">隔离的生成页面</text><text x="978" y="272" text-anchor="middle">保留界面与脚本交互</text><text class="small" x="978" y="306" text-anchor="middle">限制跳转、弹窗与任意联网</text>
<text class="small" x="860" y="386">静态模式：演示数据在页面内</text><text class="small" x="860" y="416">后端模式：可信桥只转指定 API</text><text class="small" x="860" y="446">不转发浏览器身份或任意网址</text><text class="small" x="860" y="476">生成后端不能改写外壳策略</text>
<path class="edge" d="M338 124H420" marker-end="url(#boundaryArrow)"/><text class="small" x="379" y="110" text-anchor="middle">候选文件</text><path class="edge" d="M736 124H818" marker-end="url(#boundaryArrow)"/><text class="small" x="777" y="110" text-anchor="middle">包装交付</text>
<path class="edge" d="M180 528V550H978V528"/><text x="580" y="585" text-anchor="middle">每个位置都要验证：从哪里取得数据、允许执行什么、结果能否核对</text><text class="small" x="580" y="612" text-anchor="middle">浏览器验证只覆盖列明的路径；容器、CSP、语义审核与出口检查不能互相代替</text>
</svg>
