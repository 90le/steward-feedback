<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 530" role="img" aria-labelledby="flowTitle"><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:16px;fill:#263c59}.small{font-size:13px;fill:#627791}.title{font-size:19px;fill:#12396e;font-weight:600}.white{fill:#fff}.node{fill:#fff;stroke:#b8cce5;stroke-width:1.5}.accent{fill:#1e5096;stroke:#1e5096;stroke-width:1.5}.soft{fill:#eaf1fb;stroke:#b8cce5;stroke-width:1.5}.group{fill:#f4f8fe;stroke:#b8cce5;stroke-width:1.5;stroke-dasharray:6 5}.edge{fill:none;stroke:#6487b6;stroke-width:2}.dashed{stroke-dasharray:6 5}.data{font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;fill:#1e5096}</style><title id="flowTitle">需求进入 Issue、PRD 评审、演示开发、独立测试与回报的流程</title><defs><marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6487b6"/></marker></defs><rect class="node" x="24" y="44" width="254" height="124" rx="8"/><text x="151" y="81" text-anchor="middle" class="title">小丘：澄清与查重</text><text x="151" y="113" text-anchor="middle">正式反馈形成 Issue</text><text x="151" y="143" text-anchor="middle" class="small">重复关联；缺信息先补充</text><rect class="node" x="359" y="44" width="254" height="124" rx="8"/><text x="486" y="81" text-anchor="middle" class="title">小助：PRD</text><text x="486" y="113" text-anchor="middle">目标、范围、用户验收</text><text x="486" y="143" text-anchor="middle" class="small">起草与针对性修订</text><rect class="node" x="694" y="44" width="254" height="124" rx="8"/><text x="821" y="81" text-anchor="middle" class="title">小衡：独立评审</text><text x="821" y="113" text-anchor="middle">对照原诉求与本版 PRD</text><text x="821" y="143" text-anchor="middle" class="small">通过后标记 PRD ready</text><path class="edge" d="M278 100H359" marker-end="url(#flowArrow)"/><path class="edge" d="M613 100H694" marker-end="url(#flowArrow)"/><path class="edge" d="M821 168V285" marker-end="url(#flowArrow)"/><text x="292" y="86" class="small">Feature</text><text x="839" y="219" class="small">自动接续</text><path class="edge dashed" d="M757 44V20H486V44" marker-end="url(#flowArrow)"/><text x="571" y="14" class="small">打回与修订</text><rect class="accent" x="694" y="285" width="254" height="124" rx="8"/><text x="821" y="322" text-anchor="middle" class="title white">小码：演示开发</text><text x="821" y="354" text-anchor="middle" class="white">前端、后端、启动说明</text><text x="821" y="384" text-anchor="middle" class="small white">冻结候选，保留内容摘要</text><rect class="soft" x="359" y="285" width="254" height="124" rx="8"/><text x="486" y="322" text-anchor="middle" class="title">小检：实际测试</text><text x="486" y="354" text-anchor="middle">独立脚本与运行结果</text><text x="486" y="384" text-anchor="middle" class="small">Worker 在隔离环境复跑</text><rect class="node" x="24" y="285" width="254" height="124" rx="8"/><text x="151" y="322" text-anchor="middle" class="title">小衡：交付复核</text><text x="151" y="354" text-anchor="middle">需求、候选与测试证据</text><text x="151" y="384" text-anchor="middle" class="small">通过才进入公开交付</text><path class="edge" d="M694 347H613" marker-end="url(#flowArrow)"/><path class="edge" d="M359 347H278" marker-end="url(#flowArrow)"/><path class="edge dashed" d="M205 409V445H821V409" marker-end="url(#flowArrow)"/><path class="edge dashed" d="M486 409V445"/><text x="316" y="434" class="small">小检 / 小衡提出修订 → 小码；限定轮次，仍不通过则求助</text><rect class="node" x="995" y="285" width="145" height="124" rx="8"/><text x="1067" y="322" text-anchor="middle" class="title">发布与回报</text><text x="1067" y="354" text-anchor="middle" class="small">代码、预览、报告</text><text x="1067" y="384" text-anchor="middle" class="small">小丘回原会话</text><path class="edge" d="M151 409V488H1067V409" marker-end="url(#flowArrow)"/><text x="281" y="478" class="small">带实际作者、测试者、复核者及版本署名；核对外部产物和发送回执</text></svg>
