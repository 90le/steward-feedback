<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="restTitle restDesc"><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;font-size:16px;fill:#263c59}.small{font-size:13px;fill:#627791}.title{font-size:19px;fill:#12396e;font-weight:600}.white{fill:#fff}.node{fill:#fff;stroke:#b8cce5;stroke-width:1.5}.accent{fill:#1e5096;stroke:#1e5096;stroke-width:1.5}.soft{fill:#eaf1fb;stroke:#b8cce5;stroke-width:1.5}.group{fill:#f4f8fe;stroke:#b8cce5;stroke-width:1.5;stroke-dasharray:6 5}.edge{fill:none;stroke:#6487b6;stroke-width:2}.dashed{stroke-dasharray:6 5}.data{font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;fill:#1e5096}</style><title id="restTitle">合成场景中无变化扫描及并发目录查询的 HTTP 请求数从二十次降为三次</title><desc id="restDesc">两条开放 Issue，各一页评论。冷启动后执行一次无变化扫描，再发起八次目录查询。后两个阶段合计，优化前二十次 HTTP，优化后三次。此数字不能外推生产整体节省率。</desc><text x="32" y="38" class="title">后两阶段合计</text><text x="32" y="69" class="small">单位：HTTP 请求数，统一从 0 开始</text><text x="32" y="137">优化前</text><text x="32" y="219">优化后</text><rect x="135" y="105" width="520" height="42" fill="#dce6f3"/><rect x="135" y="187" width="78" height="42" fill="#1e5096"/><text x="674" y="136" class="data">20</text><text x="230" y="218" class="data">3</text><path d="M135 255H655 M135 250V260 M265 250V260 M395 250V260 M525 250V260 M655 250V260" stroke="#bacbdd" fill="none"/><text x="135" y="283" text-anchor="middle" class="small">0</text><text x="265" y="283" text-anchor="middle" class="small">5</text><text x="395" y="283" text-anchor="middle" class="small">10</text><text x="525" y="283" text-anchor="middle" class="small">15</text><text x="655" y="283" text-anchor="middle" class="small">20</text><rect class="node" x="752" y="48" width="340" height="249" rx="8"/><text x="777" y="88" class="title">各阶段拆开看</text><text x="777" y="133">冷启动</text><text x="1055" y="133" text-anchor="end">4 → 4</text><text x="777" y="177">无变化扫描</text><text x="1055" y="177" text-anchor="end">4 → 3</text><text x="777" y="221">8 次并发目录查询</text><text x="1055" y="221" text-anchor="end">16 → 0</text><text x="777" y="269" class="small">冷启动不计入左侧两阶段合计</text><text x="32" y="334" class="small">场景：2 个开放 Issue，各 1 页评论；冷启动后推进 120 秒，再同时发起 8 次普通目录查询。</text></svg>
